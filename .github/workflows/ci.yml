name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore FastIngest.sln

      - name: Build Solution
        run: dotnet build FastIngest.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test FastIngest.sln -c Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        run: dotnet pack FastIngest.sln -c Release --no-build -o ./artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: warn
